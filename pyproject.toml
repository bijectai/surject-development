[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "biject-surject"
version = "0.0.1"
description = "A one-command, lightweight monitor that catches when an AI agent does something you didn't intend."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adeel Khatri" }]
keywords = ["agents", "llm", "guardrails", "monitoring", "policy", "mcp",
            "langchain", "langgraph", "crewai", "autogen", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
surject = "biject_surject.cli:main"

[project.urls]
Documentation = "https://github.com/bijectai/surject-development/tree/main/docs"
Repository = "https://github.com/bijectai/surject-development"
Issues = "https://github.com/bijectai/surject-development/issues"
Changelog = "https://github.com/bijectai/surject-development/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/biject_surject"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "docs/",
    "README.md",
    "CHANGELOG.md",
    "SECURITY.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
